<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detroit - Meu Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/loja.css?v=1"> 
    <link rel="stylesheet" href="../css/perfil.css?v=1"> 
</head>
<body class="home-body">

    <!-- Menu Lateral -->
    <div id="sideMenu" class="sidebar-menu">
        <div class="menu-header">
            <span>Menu</span>
            <i class="fas fa-times-circle close-btn" onclick="toggleMenu()"></i>
        </div>
        <ul class="menu-items">
            <li><a href="home.html">Tela Inicial</a></li>
            <li><a href="loja.html">Informações da Loja</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="sobre.html">Sobre nós</a></li>
        </ul>
        <div class="menu-footer">
            <button class="btn-logout-sidebar" onclick="logout()">Logout</button>
        </div>
    </div>
    <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

    <header id="appHeader">
        <div id="saudacaoContainer">
            <i class="fas fa-bars toggle-menu" onclick="toggleMenu()"></i>
            <span id="nomeUsuarioLogado">Olá!</span>
        </div>
        <div class="header-search">
            <img src="../html/img/box.png" alt="Caixa" class="box-icon-small">
            <input type="text" placeholder="Digite o código do seu pedido:">
        </div>
        <div id="iconesAcoes">
            <i class="fas fa-user-circle user-icon"></i>
        </div>
    </header>

    <main class="perfil-container">
        <section class="perfil-card">
            <div class="perfil-header-info">
                <div class="foto-perfil-wrapper">
                    <img id="fotoPerfilExibicao" src="../html/img/user_placeholder.png" alt="Foto de Perfil" class="foto-img">
                    <div class="edit-photo-icon" onclick="document.getElementById('inputFotoPerfil').click()">
                        <i class="fas fa-pencil-alt"></i>
                    </div>
                    <input type="file" id="inputFotoPerfil" style="display: none;" accept="image/*" onchange="uploadFoto(this)">
                </div>
                
                <div class="campos-principais">
                    <div class="perfil-titulo-sessao">Perfil</div>
                    <div class="campo-grupo">
                        <label>Nome:</label>
                        <div class="input-editavel">
                            <span id="perfilNome">Carregando...</span>
                            <i class="fas fa-pencil-alt" onclick="editarCampo('perfilNome', 'nomeUsuario')"></i>
                        </div>
                    </div>
                    <div class="campo-grupo">
                        <label>Usuário:</label>
                        <div class="input-editavel">
                            <span id="perfilUsuario">Carregando...</span>
                            <i class="fas fa-pencil-alt" onclick="editarCampo('perfilUsuario', 'userTag')"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="perfil-grid-campos">
                <div class="campo-grupo">
                    <label>E-mail:</label>
                    <div class="input-editavel">
                        <span id="perfilEmail">Carregando...</span>
                        <i class="fas fa-pencil-alt" onclick="editarCampo('perfilEmail', 'emailUsuario')"></i>
                    </div>
                </div>
                <div class="campo-grupo">
                    <label>Endereço:</label>
                    <div class="input-editavel">
                        <span id="perfilEndereco">Não informado</span>
                        <i class="fas fa-pencil-alt" onclick="editarCampo('perfilEndereco', 'enderecoUsuario')"></i>
                    </div>
                </div>
                <div class="campo-grupo">
                    <label>Senha:</label>
                    <div class="input-editavel">
                        <span>**********</span>
                        <i class="fas fa-pencil-alt" onclick="alert('Redirecionando para alteração de senha...')"></i>
                    </div>
                </div>
                <div class="campo-grupo">
                    <label>CEP:</label>
                    <div class="input-editavel">
                        <span id="perfilCEP">00000-000</span>
                        <i class="fas fa-pencil-alt" onclick="editarCampo('perfilCEP', 'cepUsuario')"></i>
                    </div>
                </div>
            </div>
        </section>

        <section class="avaliacoes-section">
            <div class="titulo-avaliacoes">Suas Avaliações:</div>
            <div id="listaAvaliacoesContainer">
                <p>Você ainda não realizou avaliações.</p>
            </div>
        </section>
    </main>

    <script src="../js/perfil.js"></script>
</body>
</html>
