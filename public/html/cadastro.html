<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Detroit</title>
  <link rel="stylesheet" href="../css/cadastro.css" />
</head>
<body class="login-page">
  <div class="login-wrapper">
    
    <div class="welcome-section">
      <div class="welcome-content">
        <h1>Bem-Vindo</h1>
        <p>Crie uma conta com seus dados pessoais</p>
        <div class="divider"><span>ou</span></div>
        <p>Acesse sua conta com usuário e senha</p>
        <a href="login.html" class="btn-outline">Login</a>
      </div>
    </div>

    <div class="container login-card">
      <div class="card-content">
        <div class="logo-detroit">
          <img src="../html/img/logo.png" alt="Logo Detroit" />
          <h2>DETROIT</h2>
        </div>

        <form id="cadastroForm">
          <div class="input-group">
            <label for="nome">Usuário:</label>
            <input type="text" id="nome" required />
          </div>
          <div class="input-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required />
          </div>
          <div class="input-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" required />
          </div>
          <div class="input-group">
            <label for="confirmarSenha">Confirmar senha:</label>
            <input type="password" id="confirmarSenha" required />
          </div>
          <button type="submit" class="btn-submit">Cadastrar</button>
        </form>

        <div class="social-login">
          <a href="https://accounts.google.com/signin" target="_blank" title="Cadastrar com Google">
            <img src="../html/img/google.png" alt="Google" class="social-icon" />
          </a>
          <a href="https://www.facebook.com/login" target="_blank" title="Cadastrar com Facebook">
            <img src="../html/img/facebook.png" alt="Facebook" class="social-icon" />
          </a>
          <a href="https://mail.google.com" target="_blank" title="Cadastrar com Email">
            <img src="../html/img/email.png" alt="Email" class="social-icon" />
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/cadastro.js"></script>
</body>
</html>
