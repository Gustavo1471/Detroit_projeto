<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detroit - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../css/home.css"> 
</head>
<body class="home-body">

  <div id="sideMenu" class="sidebar-menu">
    <div class="menu-header">
      <span>Menu</span>
      <i class="fas fa-times-circle close-btn" onclick="toggleMenu()"></i>
    </div>
    <ul class="menu-items">
      <li><a href="home.html">Tela Inicial</a></li>
      <li><a href="loja.html">Informações da Loja</a></li>
      <li><a href="perfil.html">Perfil</a></li>
      <li><a href="sobre.html">Sobre nós</a></li>
    </ul>
    <div class="menu-footer">
        <button class="btn-logout-sidebar" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>
  
  <header id="appHeader">
    <div id="saudacaoContainer">
      <i class="fas fa-bars toggle-menu" onclick="toggleMenu()"></i>
      <span id="nomeUsuarioLogado">Olá, Usuário!</span>
    </div>
    <div id="iconesAcoes">
      <i class="fas fa-user-circle user-icon"></i>
    </div>
  </header>

<section class="search-banner">
      <div class="banner-conteudo-wrapper">
        
        <div id="cuponsDisponiveisContainer" class="cupons-container-home">
          </div>

        <div class="search-container">
          <div class="box-icon">
            <img src="../html/img/box.png" alt="Ícone Caixa">
          </div>
          <input type="text" placeholder="Digite o código do seu pedido hoje...">
        </div>

      </div>
    </section>

<section class="home-content">
      <div class="titulo-home">
        <h2>Destaques para você:</h2>
      </div>
      <div class="categorias-grid">
        <a href="historico_pedidos.html" style="text-decoration: none; color: inherit;">
          <div class="categoria-card"><i class="fas fa-box-open"></i><span>Meus Pedidos</span></div>
        </a>

        <a href="loja.html" style="text-decoration: none; color: inherit;">
          <div class="categoria-card"><i class="fas fa-store"></i><span>Lojas Parceiras</span></div>
        </a>

        <div class="categoria-card" onclick="abrirChatbot()" style="cursor: pointer;">
          <i class="fas fa-headset"></i><span>Suporte / SAC</span>
        </div>

        <a href="perfil.html" style="text-decoration: none; color: inherit;">
          <div class="categoria-card"><i class="fas fa-user-cog"></i><span>Minha Conta</span></div>
        </a>
      </div>
    </section>
  </main>

  <script>
    function toggleMenu() {
        const menu = document.getElementById("sideMenu");
        const overlay = document.getElementById("menuOverlay");
        
        if (menu.style.width === "280px") {
            menu.style.width = "0px";
            overlay.style.display = "none";
        } else {
            menu.style.width = "280px";
            overlay.style.display = "block";
        }
    }
  </script>
  <script src="../js/home.js"></script>
</body>
</html>
